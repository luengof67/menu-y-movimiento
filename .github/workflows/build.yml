name: Compilar apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: chmod +x android/gradlew
      - run: npm run build:android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MenuYMovimiento.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: MenuYMovimiento.apk }

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build:windows
      - name: Empaquetar
        run: |
          mkdir -p out/MenuYMovimiento
          cp "dist/MenuYMovimiento/MenuYMovimiento-win_x64.exe" "out/MenuYMovimiento/Menu y Movimiento.exe"
          cp assets/LEEME-windows.txt out/MenuYMovimiento/LEEME.txt
          cd out && zip -r ../MenuYMovimiento-Windows.zip MenuYMovimiento
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: MenuYMovimiento-Windows.zip }

  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versión ${{ github.run_number }}
          body: Descarga el APK para Android o el ZIP para Windows.
          files: |
            android/MenuYMovimiento.apk
            windows/MenuYMovimiento-Windows.zip
